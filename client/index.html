<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DestinAI — Career Intelligence</title>
    <meta name="description" content="DestinAI analyzes your resume, GitHub activity, and coding profiles to deliver a personalized AI career intelligence report." />
    <meta name="theme-color" content="#F8FAFC" />
    <meta property="og:title" content="DestinAI — Career Intelligence" />
    <meta property="og:description" content="Shape Your Future with AI. Get your personalized career intelligence report." />
    <meta property="og:type" content="website" />

    <!-- Prevent theme flash (runs synchronously before React) -->
    <script>(function(){try{var t=localStorage.getItem('destinai-theme')||'light';var r=t==='system'?(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):t;if(r==='dark'){document.documentElement.classList.add('dark');document.querySelector('meta[name="theme-color"]')?.setAttribute('content','#0B1220');}else{document.documentElement.classList.remove('dark');document.querySelector('meta[name="theme-color"]')?.setAttribute('content','#F8FAFC');}}catch(e){document.documentElement.classList.remove('dark');}})();</script>

    <!-- DestinAI icon-only favicon; full wordmarks are never used as favicons. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/branding/icons/favicon-light-32.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="32x32" href="/branding/icons/favicon-dark-32.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="192x192" href="/branding/icons/favicon-light-192.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="192x192" href="/branding/icons/favicon-dark-192.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" sizes="180x180" href="/branding/icons/favicon-light-180.png" />

    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
